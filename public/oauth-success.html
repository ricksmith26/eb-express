<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Successful</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .checkmark {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
        }
        p {
            margin: 0.5rem 0;
            opacity: 0.9;
        }
        .spinner {
            margin: 2rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Authorization Successful!</h1>
        <p>Redirecting back to the app...</p>
        <div class="spinner"></div>
        <p style="font-size: 0.9rem; opacity: 0.7;">If you're not redirected, you can close this window.</p>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const connected = urlParams.get('connected');
        const error = urlParams.get('error');

        // Build deep link URL
        let deepLink = 'brigid://biometrics';
        if (connected) {
            deepLink += `?connected=${connected}`;
        } else if (error) {
            deepLink += `?error=${error}`;
        }

        console.log('Redirecting to:', deepLink);

        // Method 1: Try iframe (works on some browsers)
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = deepLink;
        document.body.appendChild(iframe);

        // Method 2: Try direct navigation (works on iOS)
        setTimeout(() => {
            window.location.href = deepLink;
        }, 100);

        // Method 3: For Android, create a link and click it
        setTimeout(() => {
            const link = document.createElement('a');
            link.href = deepLink;
            link.click();
        }, 200);

        // Auto-close after redirect attempt
        setTimeout(() => {
            // Try to close the window
            window.close();
            // If close doesn't work, at least navigate back
            if (!window.closed) {
                window.history.back();
            }
        }, 1000);
    </script>
</body>
</html>
